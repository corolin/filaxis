name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish-github-packages:
    name: 发布 GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install
      - run: bun run typecheck
      - run: bun run check:boundaries
      # 真机环境（sshd 自环——必须先于 bun test，集成用例依赖免密 localhost）
      - name: Provision loopback sshd + tmux
        run: |
          sudo apt-get update && sudo apt-get install -y tmux openssh-server
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" || true
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo service ssh start || sudo systemctl start ssh || true
          ssh -o StrictHostKeyChecking=accept-new localhost 'echo loopback-ok'
      - run: bun test
        env:
          FILAXIS_IT: "1"
          FILAXIS_IT_SSH: localhost
      # ★ 发布构建（审查问题 4：dist 被 gitignore——干净 checkout 无产物而
      #   package.json 的 types/exports.node 指向 dist，此前 alpha.6-9 包缺 dist）
      - run: bun run build
      # ★ 发包验收：pack 预检断言关键产物在包内（防回归——缺 dist 时 node 消费方装上即断）
      - name: Pack acceptance（断言 dist 产物与入口在包内）
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in dist/index.js dist/index.d.ts src/index.ts package.json README.md LICENSE NOTICE AGENTS.md; do
            grep -q "$f$" /tmp/pack.txt || { echo "PACK-MISSING: $f"; exit 1; }
          done
          echo "pack acceptance OK"
      - name: 暂存发布到 npmjs.com（npm stage publish——等待人工 2FA 审核公开）
        run: |
          printf '@syrkos:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_ACCESS_TOKEN" > .npmrc
          npm stage publish --access public --tag alpha --registry https://registry.npmjs.org/ --no-workspaces-update
        env:
          NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
